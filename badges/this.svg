
<svg
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink"
    width="259.19"
    height="20"
    role="img"
    aria-label="This: Works, but my choice colour is horrible"
>
    <style>
        rect {
            height: 20px;
        }

        text {
            text-rendering: geometricPrecision;
            dominant-baseline: middle;
            text-anchor: middle;
            font-family: Verdana,Geneva,DejaVu Sans,sans-serif;
            font-size: 110px;
            fill: #fff;
        }

        .shadow {
            transform: translate(10px, 10px);
            fill: #010101;
        }
    </style>
    <title>This: Works, but my choice colour is horrible</title>
    <linearGradient id="s" x2="0" y2="100%">
        <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
        <stop offset="1" stop-opacity=".1"/>
    </linearGradient>
    <clipPath id="r">
        <rect width="100%" rx="3" fill="#fff"/>
    </clipPath>
    <g clip-path="url(#r)" >
        <g>
            <rect width="32.49" fill="#555"/>
            <g transform="scale(.1)">
                <text x="162.45" y="100" textLength="224.9" class="shadow">This</text>
                <text x="162.45" y="100" textLength="224.9">This</text>
            </g>
        </g>
        <g transform="translate(32.49 0)">
            <rect width="226.7" fill="#00FFFF"/>
            <g transform="scale(.1)">
                <text x="1133.5" y="100" textLength="2167" class="shadow">Works, but my choice colour is horrible</text>
                <text x="1133.5" y="100" textLength="2167">Works, but my choice colour is horrible</text>
            </g>
        </g>
        <rect width="100%" height="100%" fill="url(#s)"/>
    </g>
</svg>
