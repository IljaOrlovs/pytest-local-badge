
<svg
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink"
    width="76.47"
    height="20"
    role="img"
    aria-label="hello: world"
>
    <style>
        rect {
            height: 20px;
        }

        text {
            text-rendering: geometricPrecision;
            dominant-baseline: middle;
            text-anchor: middle;
            font-family: Verdana,Geneva,DejaVu Sans,sans-serif;
            font-size: 110px;
            fill: #fff;
        }

        .shadow {
            transform: translate(10px, 10px);
            fill: #010101;
        }
    </style>
    <title>hello: world</title>
    <linearGradient id="s" x2="0" y2="100%">
        <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
        <stop offset="1" stop-opacity=".1"/>
    </linearGradient>
    <clipPath id="r">
        <rect width="100%" rx="3" fill="#fff"/>
    </clipPath>
    <g clip-path="url(#r)" >
        <g>
            <rect width="36.23" fill="#555"/>
            <g transform="scale(.1)">
                <text x="181.15" y="100" textLength="262.3" class="shadow">hello</text>
                <text x="181.15" y="100" textLength="262.3">hello</text>
            </g>
        </g>
        <g transform="translate(36.23 0)">
            <rect width="40.24" fill="#FF00FF"/>
            <g transform="scale(.1)">
                <text x="201.2" y="100" textLength="302.4" class="shadow">world</text>
                <text x="201.2" y="100" textLength="302.4">world</text>
            </g>
        </g>
        <rect width="100%" height="100%" fill="url(#s)"/>
    </g>
</svg>
