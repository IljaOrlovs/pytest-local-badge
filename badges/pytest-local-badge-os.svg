
<svg
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink"
    width="126.27"
    height="20"
    role="img"
    aria-label="OS: OS Independent"
>
    <style>
        rect {
            height: 20px;
        }

        text {
            text-rendering: geometricPrecision;
            dominant-baseline: middle;
            text-anchor: middle;
            font-family: Verdana,Geneva,DejaVu Sans,sans-serif;
            font-size: 110px;
            fill: #fff;
        }

        .shadow {
            transform: translate(10px, 10px);
            fill: #010101;
        }
    </style>
    <title>OS: OS Independent</title>
    <linearGradient id="s" x2="0" y2="100%">
        <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
        <stop offset="1" stop-opacity=".1"/>
    </linearGradient>
    <clipPath id="r">
        <rect width="100%" rx="3" fill="#fff"/>
    </clipPath>
    <g clip-path="url(#r)" >
        <g>
            <rect width="26.18" fill="#555"/>
            <g transform="scale(.1)">
                <text x="130.9" y="100" textLength="161.8" class="shadow">OS</text>
                <text x="130.9" y="100" textLength="161.8">OS</text>
            </g>
        </g>
        <g transform="translate(26.18 0)">
            <rect width="100.09" fill="#007ec6"/>
            <g transform="scale(.1)">
                <text x="500.45" y="100" textLength="900.9" class="shadow">OS Independent</text>
                <text x="500.45" y="100" textLength="900.9">OS Independent</text>
            </g>
        </g>
        <rect width="100%" height="100%" fill="url(#s)"/>
    </g>
</svg>
