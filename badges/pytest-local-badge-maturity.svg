
<svg
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink"
    width="150.53"
    height="20"
    role="img"
    aria-label="status: production/stable"
>
    <style>
        rect {
            height: 20px;
        }

        text {
            text-rendering: geometricPrecision;
            dominant-baseline: middle;
            text-anchor: middle;
            font-family: Verdana,Geneva,DejaVu Sans,sans-serif;
            font-size: 110px;
            fill: #fff;
        }

        .shadow {
            transform: translate(10px, 10px);
            fill: #010101;
        }
    </style>
    <title>status: production/stable</title>
    <linearGradient id="s" x2="0" y2="100%">
        <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
        <stop offset="1" stop-opacity=".1"/>
    </linearGradient>
    <clipPath id="r">
        <rect width="100%" rx="3" fill="#fff"/>
    </clipPath>
    <g clip-path="url(#r)" >
        <g>
            <rect width="43.69" fill="#555"/>
            <g transform="scale(.1)">
                <text x="218.45" y="100" textLength="336.9" class="shadow">status</text>
                <text x="218.45" y="100" textLength="336.9">status</text>
            </g>
        </g>
        <g transform="translate(43.69 0)">
            <rect width="106.84" fill="#4c1"/>
            <g transform="scale(.1)">
                <text x="534.2" y="100" textLength="968.4" class="shadow">production/stable</text>
                <text x="534.2" y="100" textLength="968.4">production/stable</text>
            </g>
        </g>
        <rect width="100%" height="100%" fill="url(#s)"/>
    </g>
</svg>
