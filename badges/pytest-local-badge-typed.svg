
<svg
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink"
    width="99.54"
    height="20"
    role="img"
    aria-label="typed: py.typed"
>
    <style>
        rect {
            height: 20px;
        }

        text {
            text-rendering: geometricPrecision;
            dominant-baseline: middle;
            text-anchor: middle;
            font-family: Verdana,Geneva,DejaVu Sans,sans-serif;
            font-size: 110px;
            fill: #fff;
        }

        .shadow {
            transform: translate(10px, 10px);
            fill: #010101;
        }
    </style>
    <title>typed: py.typed</title>
    <linearGradient id="s" x2="0" y2="100%">
        <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
        <stop offset="1" stop-opacity=".1"/>
    </linearGradient>
    <clipPath id="r">
        <rect width="100%" rx="3" fill="#fff"/>
    </clipPath>
    <g clip-path="url(#r)" >
        <g>
            <rect width="41.09" fill="#555"/>
            <g transform="scale(.1)">
                <text x="205.45" y="100" textLength="310.9" class="shadow">typed</text>
                <text x="205.45" y="100" textLength="310.9">typed</text>
            </g>
        </g>
        <g transform="translate(41.09 0)">
            <rect width="58.45" fill="#007ec6"/>
            <g transform="scale(.1)">
                <text x="292.25" y="100" textLength="484.5" class="shadow">py.typed</text>
                <text x="292.25" y="100" textLength="484.5">py.typed</text>
            </g>
        </g>
        <rect width="100%" height="100%" fill="url(#s)"/>
    </g>
</svg>
