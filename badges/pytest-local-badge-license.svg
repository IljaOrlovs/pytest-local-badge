
<svg
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink"
    width="81.34"
    height="20"
    role="img"
    aria-label="License: MIT"
>
    <style>
        rect {
            height: 20px;
        }

        text {
            text-rendering: geometricPrecision;
            dominant-baseline: middle;
            text-anchor: middle;
            font-family: Verdana,Geneva,DejaVu Sans,sans-serif;
            font-size: 110px;
            fill: #fff;
        }

        .shadow {
            transform: translate(10px, 10px);
            fill: #010101;
        }
    </style>
    <title>License: MIT</title>
    <linearGradient id="s" x2="0" y2="100%">
        <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
        <stop offset="1" stop-opacity=".1"/>
    </linearGradient>
    <clipPath id="r">
        <rect width="100%" rx="3" fill="#fff"/>
    </clipPath>
    <g clip-path="url(#r)" >
        <g>
            <rect width="50.66" fill="#555"/>
            <g transform="scale(.1)">
                <text x="253.3" y="100" textLength="406.6" class="shadow">License</text>
                <text x="253.3" y="100" textLength="406.6">License</text>
            </g>
        </g>
        <g transform="translate(50.66 0)">
            <rect width="30.68" fill="#dfb317"/>
            <g transform="scale(.1)">
                <text x="153.4" y="100" textLength="206.8" class="shadow">MIT</text>
                <text x="153.4" y="100" textLength="206.8">MIT</text>
            </g>
        </g>
        <rect width="100%" height="100%" fill="url(#s)"/>
    </g>
</svg>
