
<svg
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink"
    width="113.38"
    height="20"
    role="img"
    aria-label="framework: Pytest"
>
    <style>
        rect {
            height: 20px;
        }

        text {
            text-rendering: geometricPrecision;
            dominant-baseline: middle;
            text-anchor: middle;
            font-family: Verdana,Geneva,DejaVu Sans,sans-serif;
            font-size: 110px;
            fill: #fff;
        }

        .shadow {
            transform: translate(10px, 10px);
            fill: #010101;
        }
    </style>
    <title>framework: Pytest</title>
    <linearGradient id="s" x2="0" y2="100%">
        <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
        <stop offset="1" stop-opacity=".1"/>
    </linearGradient>
    <clipPath id="r">
        <rect width="100%" rx="3" fill="#fff"/>
    </clipPath>
    <g clip-path="url(#r)" >
        <g>
            <rect width="69.3" fill="#555"/>
            <g transform="scale(.1)">
                <text x="346.5" y="100" textLength="593" class="shadow">framework</text>
                <text x="346.5" y="100" textLength="593">framework</text>
            </g>
        </g>
        <g transform="translate(69.3 0)">
            <rect width="44.08" fill="#007ec6"/>
            <g transform="scale(.1)">
                <text x="220.4" y="100" textLength="340.8" class="shadow">Pytest</text>
                <text x="220.4" y="100" textLength="340.8">Pytest</text>
            </g>
        </g>
        <rect width="100%" height="100%" fill="url(#s)"/>
    </g>
</svg>
