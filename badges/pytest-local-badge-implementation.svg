
<svg
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink"
    width="152.03"
    height="20"
    role="img"
    aria-label="implementation: CPython"
>
    <style>
        rect {
            height: 20px;
        }

        text {
            text-rendering: geometricPrecision;
            dominant-baseline: middle;
            text-anchor: middle;
            font-family: Verdana,Geneva,DejaVu Sans,sans-serif;
            font-size: 110px;
            fill: #fff;
        }

        .shadow {
            transform: translate(10px, 10px);
            fill: #010101;
        }
    </style>
    <title>implementation: CPython</title>
    <linearGradient id="s" x2="0" y2="100%">
        <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
        <stop offset="1" stop-opacity=".1"/>
    </linearGradient>
    <clipPath id="r">
        <rect width="100%" rx="3" fill="#fff"/>
    </clipPath>
    <g clip-path="url(#r)" >
        <g>
            <rect width="96.28" fill="#555"/>
            <g transform="scale(.1)">
                <text x="481.4" y="100" textLength="862.8" class="shadow">implementation</text>
                <text x="481.4" y="100" textLength="862.8">implementation</text>
            </g>
        </g>
        <g transform="translate(96.28 0)">
            <rect width="55.75" fill="#007ec6"/>
            <g transform="scale(.1)">
                <text x="278.75" y="100" textLength="457.5" class="shadow">CPython</text>
                <text x="278.75" y="100" textLength="457.5">CPython</text>
            </g>
        </g>
        <rect width="100%" height="100%" fill="url(#s)"/>
    </g>
</svg>
