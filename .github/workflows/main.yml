name: CI
on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  # Reusable (called from the release.yml)
  workflow_call:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - name: Setup PDM
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pdm install
      - name: Lint (ruff check)
        run: pdm run ruff check ./src ./tests
      - name: Format check (ruff format)
        run: pdm run ruff format --check ./src ./tests
      - name: Type check (pyright)
        run: pdm run pyright
      - name: Test Python code
        # `coverage run -m pytest` starts coverage *before* pytest loads
        # the plugin, so module-level code (imports, class defs) gets
        # measured. We deliberately don't pass `--cov=` here: pytest-cov
        # would start a *second* coverage tracer and the two would fight
        # over `.coverage`. The badge SVGs are committed in the repo —
        # local devs regenerate them via `pytest --cov=...` directly.
        run: |
          pdm run coverage erase
          pdm run coverage run -m pytest
          pdm run coverage combine
          pdm run coverage report -m --fail-under=100
