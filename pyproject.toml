[project]
name = "pytest-local-badge"
dynamic = ["version"]
description = "Generate local badges (shields) reporting your test suite status."
authors = [
    {name = "Ilja Orlovs", email = "vrghost@gmail.com"},
]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["pytest", "badge", "shield", "coverage", "svg"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Plugins",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["pytest>=8.4"]

[project.urls]
Homepage = "https://github.com/VRGhost/pytest-local-badge"
Source = "https://github.com/VRGhost/pytest-local-badge"
Issues = "https://github.com/VRGhost/pytest-local-badge/issues"

[project.entry-points.pytest11]
local_badge = "pytest_local_badge.plugin"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.8",
    "pyright>=1.1.409",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.version]
source = "scm"
# Tags look like `v1.2.3` — strip the leading `v` for PEP 440 compliance.
tag_regex = '^v(?P<version>\d+\.\d+\.\d+.*)$'
# When building outside a tagged commit (CI on main, local dev), fall back
# to this so the build still succeeds.
fallback_version = "0.0.0.dev0"

[tool.pdm.build]
package-dir = "src"
includes = ["src/pytest_local_badge"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "A",
    "B",
    "C",
    "E",
    "F",
    "I",
    "W",
    "N",
    "C4",
    "T20",
    "PTH",
]
ignore = ["N802"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",
    "E402",
]
# SVG template strings — long lines are intentional.
"src/pytest_local_badge/svg_badge.py" = ["E501"]

[tool.ruff.lint.isort]
order-by-type = true
known-first-party = ["pytest_local_badge"]
forced-separate = ["test"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "test"]
exclude = ["**/__pycache__", ".venv", "docs"]
reportIncompatibleVariableOverride = false
# pytest-cov exposes the controller/totals dynamically on its _PluggyPlugin instance.
reportAttributeAccessIssue = false

[tool.pytest.ini_options]
minversion = "8.4"
addopts = "-v -l --color=yes --cov=pytest_local_badge --cov-report=term-missing --no-cov-on-fail --local-badge-output-dir badges/"
testpaths = ["test"]
