[project]
name = "pytest-local-badge"
dynamic = ["version"]
description = "Pytest plugin that writes self-hosted SVG badges (tests, coverage, skipped, xfailed, warnings, duration) to your repo — no third-party shield service required."
authors = [
    {name = "Ilja Orlovs", email = "vrghost@gmail.com"},
]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "pytest",
    "pytest-plugin",
    "badge",
    "badges",
    "shield",
    "shields",
    "svg",
    "coverage",
    "pytest-cov",
    "ci",
    "readme",
    "self-hosted",
    "offline",
    "private-repo",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Plugins",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Testing :: BDD",
    "Topic :: Software Development :: Documentation",
    "Typing :: Typed",
]
dependencies = ["pytest>=8.4"]

[project.optional-dependencies]
# Install with `pip install pytest-local-badge[cov]` to get the coverage badge.
cov = ["pytest-cov>=5.0"]

[project.urls]
Homepage = "https://github.com/IljaOrlovs/pytest-local-badge"
Source = "https://github.com/IljaOrlovs/pytest-local-badge"
Issues = "https://github.com/IljaOrlovs/pytest-local-badge/issues"
Changelog = "https://github.com/IljaOrlovs/pytest-local-badge/blob/main/CHANGELOG.md"
"Release notes" = "https://github.com/IljaOrlovs/pytest-local-badge/releases"
"CI" = "https://github.com/IljaOrlovs/pytest-local-badge/actions"

[project.entry-points.pytest11]
local_badge = "pytest_local_badge.plugin"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "coverage[toml]>=7.6",
    "ruff>=0.8",
    "pyright>=1.1.409",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.version]
source = "scm"
# Tags look like `v1.2.3` — strip the leading `v` for PEP 440 compliance.
tag_regex = '^v(?P<version>\d+\.\d+\.\d+.*)$'
# When building outside a tagged commit (CI on main, local dev), fall back
# to this so the build still succeeds.
fallback_version = "0.0.0.dev0"

[tool.pdm.build]
package-dir = "src"
includes = ["src/pytest_local_badge"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "A",
    "B",
    "C",
    "E",
    "F",
    "I",
    "W",
    "N",
    "C4",
    "T20",
    "PTH",
]
ignore = ["N802"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",
    "E402",
]
# SVG template strings — long lines are intentional.
"src/pytest_local_badge/svg_badge.py" = ["E501"]

[tool.ruff.lint.isort]
order-by-type = true
known-first-party = ["pytest_local_badge"]
forced-separate = ["tests"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv", "docs"]
reportIncompatibleVariableOverride = false
# pytest-cov exposes the controller/totals dynamically on its _PluggyPlugin instance.
reportAttributeAccessIssue = false

[tool.pytest.ini_options]
minversion = "8.4"
# Note: `--cov` is intentionally NOT in addopts. We measure coverage by
# wrapping pytest with `coverage run -m pytest` (run from CI / `pdm run
# coverage`), which starts coverage before the plugin loads — otherwise
# the plugin's module-level code is missed. `pytest --cov` is still wired
# in via the local-badge-cov path so the coverage badge keeps rendering
# under that wrapper.
addopts = "-v -l --color=yes --local-badge-output-dir badges/ --local-badge-package pytest_local_badge"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source_pkgs = ["pytest_local_badge"]
# `parallel` keeps the outer `coverage run` and pytest-cov's inner coverage
# from clobbering each other's .coverage file. Combine via `coverage combine`.
parallel = true

[tool.coverage.paths]
# Map the installed package back to the source tree so reports show
# `src/pytest_local_badge/...` rather than `.venv/lib/.../site-packages/...`.
source = ["src/pytest_local_badge", "*/pytest_local_badge"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
